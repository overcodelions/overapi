openapi: 3.0.3
info:
  title: Acme Orders
  version: 2.4.0
  description: Order management for the Acme storefront. Customers, orders and their line items.
servers:
  - url: http://localhost:4010/api/v1
    description: Local development
  - url: https://orders.staging.acme.example/api/v1
    description: Staging
  - url: https://orders.acme.example/api/v1
    description: Production
security:
  - bearerAuth: []
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders, newest first
      parameters:
        - name: status
          in: query
          description: Only orders in this state.
          schema: { type: string, enum: [open, shipped, cancelled] }
        - name: customer_id
          in: query
          description: Only this customer's orders.
          schema: { type: integer }
        - name: limit
          in: query
          description: At most this many (default 20, max 100).
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
    post:
      operationId: createOrder
      summary: Place an order for a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, items]
              properties:
                customer_id: { type: integer, description: The customer placing the order. }
                items:
                  type: array
                  description: What is being ordered.
                  items: { $ref: '#/components/schemas/LineItem' }
                note: { type: string, description: Free text shown to the warehouse. }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /orders/search:
    post:
      operationId: searchOrders
      summary: Search orders by free text across notes and SKUs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string, description: Words to look for. }
      responses:
        '200':
          description: Matching orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        description: The order number.
        schema: { type: integer }
    get:
      operationId: getOrder
      summary: One order with its line items
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
    delete:
      operationId: deleteOrder
      summary: Delete an order permanently
      responses:
        '204': { description: Deleted }
  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel an open order
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /customers/{customerId}:
    get:
      operationId: getCustomer
      summary: One customer
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LineItem:
      type: object
      required: [sku, quantity]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit_price: { type: number, readOnly: true }
    Order:
      type: object
      properties:
        id: { type: integer }
        customer_id: { type: integer }
        status: { type: string, enum: [open, shipped, cancelled] }
        total: { type: number }
        note: { type: string, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
        created_at: { type: string, format: date-time }
    Customer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        tier: { type: string, enum: [standard, gold] }
