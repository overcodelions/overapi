name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    name: build (macOS)
    # Pinned rather than `macos-latest`: the macos-26 image fails signing at
    # `security set-key-partition-list` — the temp keychain electron-builder
    # creates no longer unlocks with its own password. overcli, overgit and
    # overdb pin the same image for the same reason.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # Signed with the Developer ID and notarized when the Apple credentials
      # are present (org-level secrets, scoped to this repo). Without them the
      # build still succeeds, unsigned — and auto-update won't work on it.
      - name: Build distributables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            echo "Apple credentials detected — building signed + notarized."
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
          else
            echo "No Apple credentials available — building unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            export CSC_LINK=""
          fi
          # `--publish never`: package.json declares a GitHub publish target
          # so electron-builder writes the latest-mac.yml update feed, but on
          # a tag it would also try to upload on its own. The steps below do
          # the uploading.
          npm run dist:mac -- --publish never

      - name: Upload build artifacts (workflow run)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overapi-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Checksums
        run: |
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            release/*.dmg
            release/*.zip

      # A draft: it's published by hand once the notes read right.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/SHA256SUMS.txt

  # Copies each installer to a version-free name, so a link at
  # /releases/latest/download/<name> keeps working release after release,
  # then writes the download table from what actually shipped.
  finalize:
    name: Stable download links and release notes
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Rename, upload, and write the download table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dl stable
          gh release download "$TAG" --repo "$REPO" --dir dl --pattern '*' || true
          shopt -s nullglob
          for f in dl/*; do
            b=$(basename "$f")
            case "$b" in
              *arm64*mac*.zip) cp "$f" "stable/overapi-mac-arm64.zip" ;;
              *arm64.dmg)      cp "$f" "stable/overapi-mac-arm64.dmg" ;;
              *mac*.zip)       cp "$f" "stable/overapi-mac-x64.zip" ;;
              *.dmg)           cp "$f" "stable/overapi-mac-x64.dmg" ;;
            esac
          done
          ls -la stable
          if [ -n "$(ls -A stable)" ]; then
            gh release upload "$TAG" stable/* --repo "$REPO" --clobber
          fi
          row () {
            local label="$1"; shift
            local links=() f
            for f in "$@"; do
              [ -f "stable/$f" ] || continue
              links+=("[\`${f##*.}\`](https://github.com/$REPO/releases/latest/download/$f)")
            done
            [ ${#links[@]} -eq 0 ] && return 0
            local joined="${links[0]}" i
            for ((i = 1; i < ${#links[@]}; i++)); do joined+=" · ${links[i]}"; done
            echo "| $label | $joined |" >> notes.md
          }
          {
            echo "## Download"
            echo
            echo "| Platform | Download |"
            echo "|---|---|"
          } > notes.md
          row "**macOS** · Apple Silicon" overapi-mac-arm64.dmg overapi-mac-arm64.zip
          row "**macOS** · Intel"        overapi-mac-x64.dmg   overapi-mac-x64.zip
          cat >> notes.md <<'NOTES'

          Pre-1.0. Signed with a Developer ID and notarized, so it opens
          normally, and updates itself from here on. macOS only for now.

          `latest-mac.yml` is the in-app updater's feed, not a download.
          `SHA256SUMS.txt` and the provenance attestation are for verification.
          NOTES
          cat notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
