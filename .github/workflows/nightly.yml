name: Nightly

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check for recent commits
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.decide.outputs.should-build }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "Commits in the last 24h — building."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits in the last 24h — skipping."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (macOS)
    needs: check
    if: needs.check.outputs.should-build == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Stamp nightly version
        run: |
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y%m%d)
          node -e "
            const fs = require('fs');
            const p = require('./package.json');
            p.version = p.version.split('-')[0] + '-nightly.${DATE}.${SHA}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('version =', p.version);
          "

      # Unsigned on purpose, and nightlies don't auto-update (see
      # src/main/updater.ts), so the latest-mac.yml feed isn't uploaded —
      # a nightly release carrying it would claim to be the stable feed.
      - name: Build distributables
        run: npm run dist:mac -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overapi-nightly-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish nightly release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create stable-named copies
        shell: bash
        run: |
          mkdir -p stable
          shopt -s nullglob
          cd artifacts
          for f in *; do
            case "$f" in
              *arm64*.zip) cp "$f" "../stable/Overapi-nightly-mac-arm64.zip" ;;
              *.zip)       cp "$f" "../stable/Overapi-nightly-mac-x64.zip" ;;
              *arm64*.dmg) cp "$f" "../stable/Overapi-nightly-mac-arm64.dmg" ;;
              *.dmg)       cp "$f" "../stable/Overapi-nightly-mac-x64.dmg" ;;
            esac
          done
          ls -la ../stable

      - name: Move nightly tag to current commit
        run: |
          git tag -f nightly
          git push origin nightly --force

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          fail_on_unmatched_files: false
          body: |
            Built nightly from commit `${{ github.sha }}`.

            - macOS (Apple Silicon): [`Overapi-nightly-mac-arm64.dmg`](https://github.com/${{ github.repository }}/releases/download/nightly/Overapi-nightly-mac-arm64.dmg)
            - macOS (Intel): [`Overapi-nightly-mac-x64.dmg`](https://github.com/${{ github.repository }}/releases/download/nightly/Overapi-nightly-mac-x64.dmg)

            > Pre-release, not signed or notarized: macOS will warn on first
            > launch (right-click → Open). Nightlies don't update themselves.
          files: |
            artifacts/*
            stable/*
