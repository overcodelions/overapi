<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws://localhost:5473 http://localhost:5473; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>overapi</title>
    <!-- Splash: shown inside #root until React mounts, and continued by the
         app's own <Splash> until it has loaded. Pure CSS/SVG because the CSP
         allows no inline script. The mark is a pair of braces closing on a
         plug: an API, connected. -->
    <style>
      html, body { margin: 0; height: 100%; background: #1c1c21; }
      @media (prefers-color-scheme: light) { html, body { background: #f6f6f8; } }
      .boot { --ink: #ececf1; --muted: rgba(236,236,241,.5); --track: rgba(236,236,241,.1); --accent: #7c8bff;
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--ink); -webkit-app-region: drag; }
      @media (prefers-color-scheme: light) { .boot { --ink: #1c1c21; --muted: rgba(28,28,33,.5); --track: rgba(28,28,33,.1); --accent: #5d72ff; } }
      .boot svg { width: 56px; height: 56px; overflow: visible; }
      .boot .brace { fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 650ms cubic-bezier(.65,0,.35,1) forwards; }
      .boot .brace.r { animation-delay: 120ms; }
      .boot .dot { fill: var(--accent); transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop 380ms cubic-bezier(.34,1.56,.64,1) forwards; }
      .boot .dot:nth-of-type(1) { animation-delay: 380ms; } .boot .dot:nth-of-type(2) { animation-delay: 480ms; } .boot .dot:nth-of-type(3) { animation-delay: 580ms; }
      .boot .name { font-size: 15px; font-weight: 600; letter-spacing: -.01em; opacity: 0; animation: fade 400ms ease-out 450ms forwards; }
      .boot .tag { font-size: 11px; color: var(--muted); opacity: 0; animation: fade 400ms ease-out 650ms forwards; margin-top: -12px; }
      .boot .bar { position: relative; width: 96px; height: 2px; border-radius: 1px; overflow: hidden; background: var(--track); }
      .boot .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--accent); opacity: .8; animation: slide 1.2s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } } @keyframes pop { to { transform: scale(1); } } @keyframes fade { to { opacity: 1; } }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot * { animation: none !important; stroke-dashoffset: 0 !important; transform: none !important; opacity: 1 !important; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading overapi">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path class="brace" pathLength="1" d="M20 8 Q 10 8 10 18 L 10 26 Q 10 32 4 32 Q 10 32 10 38 L 10 46 Q 10 56 20 56" />
          <path class="brace r" pathLength="1" d="M44 8 Q 54 8 54 18 L 54 26 Q 54 32 60 32 Q 54 32 54 38 L 54 46 Q 54 56 44 56" />
          <circle class="dot" cx="22" cy="32" r="4.5" /><circle class="dot" cx="32" cy="32" r="4.5" /><circle class="dot" cx="42" cy="32" r="4.5" />
        </svg>
        <div class="name">overapi</div>
        <div class="tag">APIs as tools for agents</div>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
