<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- icon.svg redrawn for 16-32px: heavier braces, and one solid dot —
       three would run together once downscaled. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f1ed"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect x="100" y="122" width="824" height="824" rx="185" ry="185" fill="#000000" fill-opacity="0.32" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#plate)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" ry="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g fill="none" stroke="#111113" stroke-width="88" stroke-linecap="round" stroke-linejoin="round">
    <path d="M418 325 Q 340 325 340 403 L 340 465 Q 340 512 294 512 Q 340 512 340 559 L 340 621 Q 340 699 418 699"/>
    <path d="M606 325 Q 684 325 684 403 L 684 465 Q 684 512 730 512 Q 684 512 684 559 L 684 621 Q 684 699 606 699"/>
  </g>
  <circle cx="512" cy="512" r="62" fill="#111113"/>
</svg>
